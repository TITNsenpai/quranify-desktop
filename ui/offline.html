<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاستماع أوفلاين</title>
<style>
:root {
  --bg: #000;
  --panel: rgba(255,255,255,.055);
  --panel-2: rgba(255,255,255,.085);
  --line: rgba(255,255,255,.07);
  --text: #f5f5f7;
  --muted: #9a9aa0;
  --dim: #6c6c72;
  --badge: #1c1c1f;
  --accent: #5ea0ff;
  --ok: #43d17a;
  --danger: #ff6b6b;
  --r-xl: 28px;
  --r-lg: 20px;
  --r-md: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 "Segoe UI", Tahoma, system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(900px 340px at 55% -8%, rgba(46,104,190,.38), transparent 70%),
    radial-gradient(700px 300px at 10% -10%, rgba(20,60,120,.22), transparent 70%);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input { font: inherit; color: inherit; }
svg { display: block; flex: none; }

.app { position: relative; display: grid; grid-template-columns: 270px 1fr; gap: 20px; height: 100%; padding: 16px; }

/* ── sidebar ── */
.side {
  display: flex; flex-direction: column; min-height: 0;
  border-radius: var(--r-xl); padding: 22px 16px 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; font-size: 21px; font-weight: 700; }
.nav button {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; border-radius: var(--r-md); color: var(--muted); font-weight: 600; font-size: 15.5px;
  transition: background .15s, color .15s;
}
.nav button:hover { background: rgba(255,255,255,.05); color: var(--text); }
.nav button.on { color: var(--text); }
.nav .count { margin-inline-start: auto; font-size: 12px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; }
.storage { padding: 12px; border-radius: var(--r-md); background: rgba(0,0,0,.25); font-size: 13px; color: var(--muted); }
.storage b { color: var(--text); font-weight: 600; }
.storage button { color: var(--accent); font-size: 13px; margin-top: 4px; }
.net { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(67,209,122,.7); }
.btn-white {
  height: 40px; border-radius: 999px; background: #fff; color: #000; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, opacity .15s;
}
.btn-white:hover { transform: scale(1.02); }
.btn-white:disabled { opacity: .35; cursor: default; transform: none; }

/* ── main ── */
.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; padding: 4px 6px 120px 6px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
h1 { font-size: 34px; font-weight: 700; margin: 6px 0 20px; letter-spacing: -.3px; }
h2 { font-size: 19px; font-weight: 700; margin: 26px 0 14px; display: flex; align-items: center; gap: 10px; }
h2 .link { margin-inline-start: auto; font-size: 13.5px; font-weight: 600; color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; }

.search {
  display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; margin-bottom: 18px;
  border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); max-width: 460px;
}
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; }
.search input::placeholder { color: var(--dim); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
.card {
  padding: 16px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid transparent;
  text-align: center; transition: background .15s, transform .15s;
}
.card:hover { background: var(--panel-2); transform: translateY(-2px); }
.card .name { font-weight: 700; margin-top: 12px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  width: 96px; height: 96px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center;
  font-size: 38px; font-weight: 700; color: rgba(255,255,255,.92);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 10px 30px rgba(0,0,0,.35);
}
.avatar.big { width: 150px; height: 150px; font-size: 60px; margin: 0; }

.empty { text-align: center; padding: 70px 20px; color: var(--muted); }
.empty svg { margin: 0 auto 16px; opacity: .55; }
.empty .btn-white { display: inline-flex; padding: 0 22px; margin-top: 18px; }

/* reciter header */
.hero { display: flex; align-items: center; gap: 26px; margin: 4px 0 18px; }
.hero h1 { margin: 0 0 4px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.back:hover { color: var(--text); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.pill {
  height: 34px; padding: 0 15px; border-radius: 999px; background: var(--panel-2); color: var(--muted);
  font-size: 13.5px; font-weight: 600; border: 1px solid var(--line);
}
.pill:hover { color: var(--text); }
.pill.on { background: #fff; color: #000; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.btn {
  height: 38px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px;
  background: var(--panel-2); border: 1px solid var(--line); font-weight: 600; font-size: 14px;
}
.btn:hover { background: rgba(255,255,255,.13); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: #fff; color: #000; border-color: #fff; }
.btn.primary:hover { background: #e9e9ec; }
.btn.danger { color: var(--danger); }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
.toggle input { accent-color: #fff; width: 16px; height: 16px; }

/* surah rows */
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 14px; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 8px 10px; border-radius: var(--r-lg);
  transition: background .12s; cursor: pointer;
}
.row:hover { background: rgba(255,255,255,.06); }
.row.playing { background: rgba(255,255,255,.09); }
.row.na { opacity: .42; cursor: default; }
.badge {
  width: 46px; height: 46px; border-radius: var(--r-md); background: var(--badge); flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 17px;
}
.row:hover:not(.na) .badge .n, .row.playing .badge .n { display: none; }
.badge .ic { display: none; }
.row:hover:not(.na) .badge .ic, .row.playing .badge .ic { display: block; }
.row .t { flex: 1; min-width: 0; }
.row .t1 { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t1 span { font-weight: 500; color: var(--muted); font-size: 13.5px; }
.row .t2 { color: var(--muted); font-size: 12.5px; }
.st { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); flex: none; }
.st:hover { background: rgba(255,255,255,.08); color: var(--text); }
.st.done { color: var(--ok); }
.st.done:hover { color: var(--danger); }
.st .x { display: none; }
.st.done:hover .ok, .st.busy:hover .ring { display: none; }
.st.done:hover .x, .st.busy:hover .x { display: block; }
.ring circle { transition: stroke-dashoffset .25s; }

/* queue panel */
.queue { border-radius: var(--r-lg); background: var(--panel); padding: 14px 16px; margin-bottom: 8px; }
.qline { display: flex; align-items: center; gap: 12px; }
.bar { height: 4px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: #fff; width: 0; transition: width .25s; }

/* ── player ── */
.player {
  position: absolute; left: 6px; right: 6px; bottom: 6px; height: 74px;
  display: grid; grid-template-columns: minmax(180px, 1fr) minmax(320px, 2fr) minmax(160px, 1fr); align-items: center; gap: 16px;
  padding: 0 18px; border-radius: var(--r-xl);
  background: rgba(38,38,42,.62); border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(28px) saturate(140%); box-shadow: 0 20px 50px rgba(0,0,0,.5);
}
.player.hidden { display: none; }
.now { display: flex; align-items: center; gap: 12px; min-width: 0; }
.now .avatar { width: 44px; height: 44px; font-size: 18px; margin: 0; }
.now .t { min-width: 0; }
.now .t1 { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctr { display: flex; flex-direction: column; gap: 6px; }
.ctr { position: relative; }
.ctl { display: flex; align-items: center; justify-content: center; gap: 22px; }
.ctl button { color: #d8d8dc; opacity: .9; }
.ctl button:hover { opacity: 1; color: #fff; }
.ctl button.on { color: var(--accent); }
.ctl .pp { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.seek { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
.vol { display: flex; align-items: center; gap: 10px; justify-content: flex-end; direction: ltr; }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; outline: 0; cursor: pointer;
  background: linear-gradient(90deg, #fff var(--p, 0%), rgba(255,255,255,.18) var(--p, 0%));
}
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .15s; }
input[type=range]:hover::-webkit-slider-thumb { opacity: 1; }
.seek input { flex: 1; }
.vol input { width: 90px; }
.vol .ctl2 { margin-right: 6px; }

/* settings */
.set-card { border-radius: var(--r-lg); background: var(--panel); padding: 6px 18px; margin-bottom: 16px; max-width: 720px; }
.set-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .t { flex: 1; }
.set-row .t1 { font-weight: 600; font-size: 15px; }
.set-row.off { opacity: .45; pointer-events: none; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.16); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.switch input:checked + i { background: var(--ok); }
.switch input:checked + i::after { transform: translateX(-18px); }
.set-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 22px 4px 8px; }

@font-face { font-family: "Amiri Quran"; src: url(/font/quran.woff2) format("woff2"); font-display: swap; }
.tags { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(94,160,255,.16); color: #9cc3ff; }
.tag.ok { background: rgba(67,209,122,.15); color: var(--ok); }
.tag.dim { background: rgba(255,255,255,.07); color: var(--muted); }
.filters { display: grid; gap: 10px; margin: 0 0 20px; }
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flabel { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 78px; }
.pill .cnt, .cnt { font-size: 11.5px; opacity: .6; margin-inline-start: 2px; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
.iconbtn:disabled { opacity: .3; cursor: default; background: none; }
.iconbtn.fav { color: #ff6b8a; }
.iconbtn.big { width: 46px; height: 46px; margin-inline-start: auto; align-self: center; background: var(--panel-2); }
.rowacts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.row:hover .rowacts, .row .rowacts:has(.fav) { opacity: 1; }
.row .rowacts .iconbtn:not(.fav) { opacity: .85; }
.row:not(:hover) .rowacts .iconbtn:not(.fav) { visibility: hidden; }
.resume { color: #9cc3ff; }
h2 .link { color: var(--accent); font-size: 13.5px; font-weight: 600; margin-inline-start: auto; }
.avatar.pl { color: rgba(255,255,255,.9); }
.avatar.pl svg { width: 40px; height: 40px; }
.keys { display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 14px; color: var(--muted); }
kbd { font: 600 12px "Segoe UI", sans-serif; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; color: var(--text); direction: ltr; display: inline-block; }
.ctl button#bRead { margin-inline-start: 6px; }
/* reader */
.reader {
  position: absolute; top: 0; bottom: 92px; left: 6px; width: min(620px, 62%); z-index: 5;
  border-radius: var(--r-xl); background: rgba(20,20,23,.94); border: 1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(24px); box-shadow: 0 20px 60px rgba(0,0,0,.55);
  transform: translateX(-20px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s;
  display: flex; flex-direction: column; overflow: hidden;
}
.reader.show { transform: none; opacity: 1; pointer-events: auto; }
#readerBody { overflow-y: auto; padding: 20px 24px 30px; user-select: text; }
#readerBody::-webkit-scrollbar { width: 8px; }
#readerBody::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
.rhead { display: flex; align-items: flex-start; gap: 12px; }
.rnav { margin-inline-start: auto; display: flex; gap: 4px; }
.rtools { display: flex; gap: 16px; align-items: center; padding: 12px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 8px; flex-wrap: wrap; }
.basmala { font-family: "Amiri Quran", "Traditional Arabic", serif; font-size: 30px; text-align: center; padding: 14px 0 6px; }
.ayah { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.ayah .ar { font-family: "Amiri Quran", "Traditional Arabic", serif; font-size: 27px; line-height: 2.15; }
.ayah .num { color: #9cc3ff; font-size: .85em; white-space: nowrap; }
.ayah .tf { color: var(--muted); font-size: 14.5px; line-height: 1.8; margin-top: 4px; }
.ayah .en { color: #b9b9bf; font-size: 14px; line-height: 1.6; margin-top: 6px; text-align: left; }
.modal .box input { width: 100%; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); padding: 0 14px; font-size: 15px; outline: 0; margin: -6px 0 16px; }
.modal .box input:focus { border-color: rgba(255,255,255,.3); }
.plist { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; margin: -6px 0 14px; }
.plitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; text-align: right; }
.plitem:hover { background: rgba(255,255,255,.07); }
.plitem span:first-of-type { flex: 1; font-weight: 600; }

/* captions, popovers, extras */
.caption {
  position: absolute; left: 6px; right: 6px; bottom: 92px; z-index: 4; display: none;
  padding: 14px 22px; border-radius: var(--r-lg); text-align: center;
  background: rgba(16,16,19,.88); border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(18px);
  box-shadow: 0 14px 40px rgba(0,0,0,.45); max-height: 42%; overflow-y: auto;
}
.caption.show { display: block; }
.cap-ar { font-family: "Amiri Quran", "Traditional Arabic", serif; font-size: 25px; line-height: 2; }
.cap-ar .num, .ayah .num { color: #9cc3ff; font-size: .85em; }
.cap-tf { color: var(--muted); font-size: 14px; line-height: 1.7; margin-top: 2px; }
.cap-en { color: #b9b9bf; font-size: 13.5px; line-height: 1.55; margin-top: 4px; }
.ayah { transition: background .25s; border-radius: 12px; padding-inline: 10px; margin-inline: -10px; cursor: pointer; }
.ayah:hover { background: rgba(255,255,255,.03); }
.ayah.cur { background: rgba(94,160,255,.12); }
.ayah.cur .ar { color: #fff; }
.pop {
  position: absolute; bottom: 92px; z-index: 6; width: 290px; padding: 14px 16px; display: none;
  border-radius: 18px; background: rgba(28,28,32,.97); border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}
.pop.show { display: block; }
.pop .pt { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.pgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.arow { display: flex; align-items: center; gap: 12px; padding: 7px 0; direction: rtl; }
.arow span { width: 44px; font-weight: 600; font-size: 14px; }
.arow input { flex: 1; direction: ltr; }
.ctl2 { gap: 16px !important; }
.ctl2 button { position: relative; }
#sleepBadge { position: absolute; top: -6px; left: -8px; font: 700 10px/1 "Segoe UI"; font-style: normal; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 4px; }
#sleepBadge:empty { display: none; }
.friday { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 18px; border-radius: var(--r-lg);
  background: linear-gradient(90deg, rgba(94,160,255,.16), rgba(94,160,255,.05)); border: 1px solid rgba(94,160,255,.22); }
.friday > div { flex: 1; }
.friday svg { color: #9cc3ff; }

/* toast + modal */
.toast {
  position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px;
  transition: opacity .2s, transform .2s; z-index: 50; max-width: 80vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 60; backdrop-filter: blur(4px); }
.modal.show { display: grid; }
.modal .box { width: min(380px, 90vw); background: #1b1b1e; border: 1px solid var(--line); border-radius: 24px; padding: 22px; }
.modal .box p { margin: 0 0 18px; font-size: 15.5px; }
.modal .box .actions { justify-content: flex-start; margin: 0; }
.banner {
  display: none; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-md);
  background: rgba(94,160,255,.12); border: 1px solid rgba(94,160,255,.25); margin-bottom: 14px; font-size: 14px;
}
.banner.show { display: flex; }
.banner button { margin-inline-start: auto; color: var(--accent); font-weight: 700; }

/* khatma + memorization */
.sel { height: 40px; border-radius: 12px; border: 1px solid var(--line); background: #1d1d21; color: var(--text); padding: 0 12px; font-size: 14.5px; outline: 0; max-width: 100%; min-width: 220px; }
.sel:focus, .num-in:focus { border-color: rgba(255,255,255,.3); }
.num-in { width: 90px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: #1d1d21; padding: 0 12px; font-size: 15px; outline: 0; }
.kcard { padding: 16px 18px; }
.kcard .flabel { display: block; margin-bottom: 8px; }
.khead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.kprev { margin: 16px 0 14px; color: var(--muted); font-size: 14px; }
.kprev b { color: var(--text); }
.tag.warn { background: rgba(255,180,80,.15); color: #ffc46b; }
.wird { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--panel); margin: 4px 0 8px; max-width: 980px; flex-wrap: wrap; }
.wnum { width: 54px; height: 54px; border-radius: var(--r-md); background: rgba(94,160,255,.16); color: #9cc3ff; display: grid; place-items: center; font-size: 22px; font-weight: 700; flex: none; }
.wt { font-weight: 700; font-size: 17px; margin: 2px 0; }
.wacts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn.done { color: var(--ok); }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; max-width: 980px; }
.kday { height: 38px; border-radius: 10px; background: var(--panel); color: var(--muted); font-weight: 700; font-size: 13.5px; border: 1px solid transparent; }
.kday:hover { background: var(--panel-2); color: var(--text); }

function hue(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
function avatar(name, cls = '') {
  const h = hue(name), ch = String(name || '؟').trim().replace(/^(ال)/, '').charAt(0);
  return `<div class="avatar ${cls}" style="background:linear-gradient(145deg,hsl(${h} 45% 34%),hsl(${(h + 40) % 360} 55% 16%))">${esc(ch)}</div>`;
}
function ring(pct) {
  const c = 2 * Math.PI * 9, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg class="ring" width="24" height="24" viewBox="0 0 24 24" style="transform:rotate(-90deg)"><circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="2.6"/><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

// ───────── recitation types ─────────
const STYLES = { murattal: 'مرتّل', mujawwad: 'مجوّد', muallim: 'معلّم', special: 'تلاوات مميزة' };
function styleOf(name) {
  const p = String(name).split(' - ').slice(1).join(' - ');
  if (/مجود/.test(p)) return 'mujawwad';
  if (/معلم/.test(p)) return 'muallim';
  if (/مميزة/.test(p)) return 'special';
  return 'murattal';
}
const REWAYA_RULES = [
  [/حفص/, 'حفص عن عاصم'], [/ورش/, 'ورش عن نافع'], [/قالون/, 'قالون عن نافع'],
  [/الدوري عن الكسائي/, 'الدوري عن الكسائي'], [/الدوري/, 'الدوري عن أبي عمرو'], [/شعبة/, 'شعبة عن عاصم'],
  [/السوسي/, 'السوسي عن أبي عمرو'], [/البزي|قنبل/, 'ابن كثير (البزي وقنبل)'], [/ابن ذكوان|هشام/, 'ابن عامر (هشام وابن ذكوان)'],
  [/خلف/, 'خلف عن حمزة'], [/يعقوب/, 'يعقوب الحضرمي'], [/جماز|جعفر/, 'أبو جعفر'],
];
function rewayaOf(name) {
  const r = String(name).split(' - ')[0];
  for (const [re, label] of REWAYA_RULES) if (re.test(r)) return label;
  return r.trim();
}

function metaFor(r, m) {

}
const has = (key, n) => !!(S.libMap[key] && S.libMap[key].has(n));
function rowState(key, n) {
  if (has(key, n)) return 'done';
  const c = S.queue.current;
  if (c && c[0] === key && c[1] === n) return 'current';

}

let userTimer;

const isFavReciter = key => S.user.favs.reciters.some(m => m.key === key);
const isFavSurah = (key, n) => S.user.favs.surahs.some(x => x.m.key === key && x.n === n);

// ───────── events from Rust ─────────
let libTimer;
window.__qo = {
  on(e) {
    switch (e.type) {
      case 'catalog':
        S.catalogLoading = false;
        if (e.reciters) { S.catalog = e.reciters; S.catalogErr = null; } else S.catalogErr = e.error;
        if (['reciters', 'khatma', 'hifz'].includes(S.view) && !(S.view === 'hifz' && H.active)) render();
        break;
      case 'library':
        S.lib = e; S.libMap = {}; S.libLoaded = true;
        for (const it of e.items) S.libMap[it.key] = new Set(it.surahs);
        $('#used').textContent = fmtSize(e.total);
        if (['library', 'detail', 'favorites', 'playlist', 'khatma'].includes(S.view)) render(); else updateRows();
        break;
      case 'queue': {
        S.queue = e;
        const n = e.pending.length + (e.current ? 1 : 0);
        const qc = $('#qcount'); qc.hidden = !n; qc.textContent = n;
        if (S.view === 'library') renderQueue(); updateRows();
        break;
      }
      case 'queueWaiting': toast('مفيش إنترنت — التحميل هيكمّل لوحده لما النت يرجع'); break;
      case 'progress':
        S.progress[e.key + ':' + e.surah] = e.total ? e.got / e.total : 0;
        updateRow(e.key, e.surah); renderQueue();
        break;
      case 'done':
        (S.libMap[e.key] ||= new Set()).add(e.surah);
        delete S.progress[e.key + ':' + e.surah];
        updateRow(e.key, e.surah);
        clearTimeout(libTimer); libTimer = setTimeout(() => post({ cmd: 'library' }), 800);
        break;
      case 'error':
        toast(`تعذّر تحميل سورة ${SURAHS[e.surah - 1][0]}: ${e.message}`);
        delete S.progress[e.key + ':' + e.surah]; updateRow(e.key, e.surah);
        break;
      case 'toast': toast(e.message); break;
      case 'moving':
        S.moving = e.on;
        if (e.on) toast('جاري نقل التحميلات…');
        if (S.view === 'settings') render();
        break;
      case 'settings':
        S.settings = e;
        if (e.error) toast(e.error);
        if (S.view === 'settings' || S.view === 'khatma') render();
        break;
      case 'status': setOnline(e.online); break;
      case 'user':
        if (e.data && typeof e.data === 'object') {
          S.user = Object.assign({ favs: { reciters: [], surahs: [] }, playlists: [], resume: {} }, e.data);
          S.user.favs = Object.assign({ reciters: [], surahs: [] }, S.user.favs || {});
        }
        S.userLoaded = true;
        if (['favorites', 'playlists', 'playlist', 'detail', 'khatma', 'hifz', 'library'].includes(S.view) && !(S.view === 'hifz' && H.active)) render();
        break;
      case 'text':
        if (e.ayahs) S.text[e.surah] = e.ayahs; else S.text[e.surah] = { error: e.error };
        if (e.ayahs) post({ cmd: 'textStatus' });
        syncAyah(true);
        if (S.reader.open && (S.reader.range ? wirdHas(e.surah) : S.reader.n === e.surah)) renderReader();
        onTextArrived(e.surah);
        break;
      case 'timing':
        S.timing[e.read + ':' + e.surah] = e.t || { error: e.error };
        syncAyah(true);
        break;
      case 'sleep':
        S.sleepUntil = e.until || 0;
        syncSleepButton(); renderPop();
        break;
      case 'textStatus': S.textHave = e.have; if (S.reader.open) renderReaderTools(); break;
      case 'textProgress':
        S.textHave = Math.max(S.textHave, e.done - e.failed);
        if (S.reader.open) renderReaderTools();
        if (e.done === 114) { toast(e.failed ? `اتحفظ النص، وفشلت ${e.failed} سورة` : 'نص المصحف كله اتحفظ على جهازك'); post({ cmd: 'textStatus' }); }
        break;
    }
  }
};

function moshafMatches(m) {
  const f = S.f;

function reciterCards() {

  if (!list.length) return `<div class="empty" style="grid-column:1/-1">مفيش نتائج بالفلاتر دي</div>`;
  return list.map(r => {
    const ms = r.m.filter(moshafMatches);
    const dl = r.m.some(m => S.libMap[String(m.id)] && S.libMap[String(m.id)].size);
    const full = ms.some(m => m.list.length === 114);
    const label = ms.length > 1 ? ms.length + ' مصاحف' : esc(ms[0].ar);

function saveSettings(patch, autostart) {

  const fav = isFavReciter(meta.key);
  return `<div class="hero">${avatar(meta.reciter_ar, 'big')}<div>
      <div class="sub">قارئ</div><h1>${esc(meta.reciter_ar)}</h1><div class="sub">${esc(meta.reciter_en || '')}</div>
      <div class="sub" style="margin-top:6px">${meta.list.length} سورة · محمّل منها ${S.libMap[meta.key] ? S.libMap[meta.key].size : 0}</div></div>
      <button class="iconbtn big ${fav ? 'fav' : ''}" data-act="favReciter" title="${fav ? 'شيل من المفضلة' : 'ضيف للمفضلة'}">${fav ? I.heartFill : I.heart}</button></div>`;
}
function viewDetail() {
  const d = S.detail; if (!d) return '';
  const meta = d.metas[d.sel], key = meta.key;
  const got = S.libMap[key] ? S.libMap[key].size : 0;
  const busy = S.queue.pending.some(p => p[0] === key) || (S.queue.current && S.queue.current[0] === key);
  let html = `<button class="back" data-act="back">${I.back} رجوع</button>` + heroHtml(meta);
  if (d.metas.length > 1) {
    html += `<div class="pills">${d.metas.map((m, i) => `<button class="pill ${i === d.sel ? 'on' : ''}" data-sel="${i}">${esc(rewayaOf(m.moshaf_ar))} · ${STYLES[styleOf(m.moshaf_ar)]}${m.list.length === 114 ? '' : ` <span class="cnt">${m.list.length}</span>`}</button>`).join('')}</div>`;
  }
  html += `<div class="sub" style="margin-top:6px">${esc(meta.moshaf_ar)}</div>`;
  html += `<div class="actions">
    <button class="btn primary" data-act="playAll">${I.play} تشغيل</button>
    ${got < meta.list.length ? `<button class="btn" data-act="dlAll">${I.down} تحميل الكل</button>` : ''}
    ${busy ? `<button class="btn" data-act="cancelKey">${I.stop} إيقاف التحميل</button>` : ''}
    ${got ? `<button class="btn danger" data-act="delKey">${I.trash} حذف المحمّل</button>` : ''}
    <label class="toggle" style="margin-inline-start:8px"><input type="checkbox" id="onlyDl" ${S.onlyDl ? 'checked' : ''}> المحمّلة فقط</label>
  </div><h2>السور</h2><div class="rows">`;
  const items = (S.onlyDl ? meta.list.filter(n => has(key, n)) : meta.list).map(n => ({ m: meta, n }));
  html += rowsHtml(items);
  return html + '</div>';
}

function playable(meta, n) { return has(meta.key, n) || S.online; }

function statusHtml(key, n) {
  const st = rowState(key, n);
  if (st === 'done') return `<button class="st done" data-del="${n}" title="محمّلة — اضغط للحذف">${I.check}${I.x}</button>`;
  if (st === 'current') return `<button class="st busy" data-cancel="${n}" title="إيقاف">${ring(S.progress[key + ':' + n] || 0)}${I.x}</button>`;
  if (st === 'queued') return `<button class="st busy" data-cancel="${n}" title="في الانتظار — اضغط للإلغاء">${ring(0)}${I.x}</button>`;
  return `<button class="st" data-dl="${n}" title="تحميل">${I.down}</button>`;
}
// Rows for a list of {m: meta, n} items. Clicking one plays this list starting there.
function rowsHtml(items, opt = {}) {
  const start = S.rowList.length;
  return items.map((it, j) => {
    const { m, n } = it, s = SURAHS[n - 1], ok = playable(m, n), i = start + j;
    S.rowMeta[m.key] = m; S.rowList.push(it);
    const fav = isFavSurah(m.key, n);
    const resume = S.user.resume[m.key + ':' + n];
    return `<div class="row ${ok ? '' : 'na'}" data-row="${n}" data-key="${esc(m.key)}" data-i="${i}">
      <div class="badge"><span class="n">${n}</span><span class="ic">${I.play}</span></div>
      <div class="t"><div class="t1">${esc(s[0])} <span>${esc(s[1])}</span></div>
        <div class="t2">${opt.showReciter ? esc(m.reciter_ar) + ' · ' : ''}${s[2] ? 'مكية' : 'مدنية'}${resume ? ` · <span class="resume">وقفت عند ${fmtTime(resume)}</span>` : ''}</div></div>
      <span class="rowacts">
        <button class="iconbtn" data-read="${n}" title="اقرأ السورة">${I.book}</button>
        <button class="iconbtn" data-addpl="${i}" title="ضيف لقائمة تشغيل">${I.plus}</button>
        <button class="iconbtn ${fav ? 'fav' : ''}" data-favs="${i}" title="${fav ? 'شيل من المفضلة' : 'ضيف للمفضلة'}">${fav ? I.heartFill : I.heart}</button>
        ${opt.removable ? `<button class="iconbtn" data-rmpl="${j}" title="شيل من القائمة">${I.x.replace('class="x"', '')}</button>` : ''}
      </span>
      <span class="stw">${statusHtml(m.key, n)}</span></div>`;
  }).join('');
}
function updateRow(key, n) {
  document.querySelectorAll(`.row[data-key="${key}"][data-row="${n}"]`).forEach(row => {
    row.querySelector('.stw').innerHTML = statusHtml(key, n);
    row.classList.toggle('na', !playable(S.rowMeta[key] || { key }, n));
  });
}
function updateRows() { document.querySelectorAll('.row[data-row]').forEach(r => updateRow(r.dataset.key, +r.dataset.row)); }

// ───────── playlist picker ─────────
function pickPlaylist(item) {
  const pls = S.user.playlists;
  const box = $('#plpick');
  box.innerHTML = `<div class="box"><p>ضيف سورة ${esc(SURAHS[item.n - 1][0])} (${esc(item.m.reciter_ar)}) إلى:</p>
    <div class="plist">${pls.map((p, i) => `<button class="plitem" data-pl="${i}">${I.list}<span>${esc(p.name)}</span><span class="sub">${p.items.length}</span></button>`).join('') || '<div class="sub">مفيش قوائم لسه.</div>'}</div>
    <div class="actions"><button class="btn primary" data-pl="new">${I.plus} قائمة جديدة</button><button class="btn" data-pl="cancel">إلغاء</button></div></div>`;
  box.classList.add('show');
  box.onclick = async e => {
    const b = e.target.closest('[data-pl]');
    if (e.target === box || (b && b.dataset.pl === 'cancel')) { box.classList.remove('show'); return; }
    if (!b) return;
    let idx = b.dataset.pl;
    if (idx === 'new') {
      box.classList.remove('show');
      const name = await promptBox('اسم القائمة الجديدة', `قائمة ${pls.length + 1}`);
      if (!name) return;
      pls.push({ id: Date.now(), name, items: [] }); idx = pls.length - 1;
    }
    const p = pls[+idx];
    if (p.items.some(x => x.m.key === item.m.key && x.n === item.n)) toast('السورة موجودة في القائمة دي أصلًا');
    else { p.items.push({ m: item.m, n: item.n }); toast(`اتضافت لـ "${p.name}"`); }
    saveUser(); box.classList.remove('show');
    if (S.view === 'playlists') render();
  };
}

// ───────── clicks ─────────
document.addEventListener('click', async e => {
  const t = e.target.closest('button, .row, [data-nav]'); if (!t || t.closest('#plpick')) return;
  const d = S.detail, meta = d && d.metas[d.sel];
  const rowEl = t.closest('.row');
  const rowMeta = rowEl ? S.rowMeta[rowEl.dataset.key] : null;
  if (t.dataset.nav) { S.detailFrom = t.dataset.nav; return go(t.dataset.nav); }
  if (t.dataset.openLib) {
    const it = S.lib.items.find(i => i.key === t.dataset.openLib);
    S.detailFrom = 'library'; return go('detail', { metas: [it.meta], sel: 0 });
  }
  if (t.dataset.openFav) {
    S.detailFrom = 'favorites'; return go('detail', { metas: [S.user.favs.reciters[+t.dataset.openFav]], sel: 0 });
  }
  if (t.dataset.openPl) { S.playlist = +t.dataset.openPl; return go('playlist'); }
  if (t.dataset.openRec) {
    const r = S.catalog.find(r => String(r.id) === t.dataset.openRec);
    const metas = r.m.map(m => metaFor(r, m));
    // Prefer one with downloads, then one matching the filters, then the fullest Hafs, then the fullest.
    const score = (m, i) => (S.libMap[m.key] && S.libMap[m.key].size ? 1e7 : 0) + (moshafMatches(r.m[i]) ? 1e6 : 0) + (m.moshaf_ar.includes('حفص') ? 1e3 : 0) + m.list.length;
    const sel = metas.reduce((best, m, i) => score(m, i) > score(metas[best], best) ? i : best, 0);
    S.detailFrom = 'reciters'; return go('detail', { metas, sel });
  }
  if (t.dataset.fstyle !== undefined) return setFilter({ style: t.dataset.fstyle });
  if (t.dataset.frew !== undefined) return setFilter({ rewaya: t.dataset.frew });
  if (t.dataset.sel) { d.sel = +t.dataset.sel; return render(); }
  if (t.dataset.start) { saveSettings({ startPage: t.dataset.start }); return render(); }
  if (t.dataset.read) { e.stopPropagation(); return openReader(+t.dataset.read); }
  if (t.dataset.favs) { e.stopPropagation(); const it = S.rowList[+t.dataset.favs]; toggleFavSurah(it.m, it.n); return render(); }
  if (t.dataset.addpl) { e.stopPropagation(); return pickPlaylist(S.rowList[+t.dataset.addpl]); }
  if (t.dataset.rmpl) {
    e.stopPropagation(); const p = S.user.playlists[S.playlist]; p.items.splice(+t.dataset.rmpl, 1); saveUser(); return render();
  }
  if (t.dataset.dl) { e.stopPropagation(); return post({ cmd: 'download', meta: rowMeta, surahs: [+t.dataset.dl] }); }
  if (t.dataset.cancel) { e.stopPropagation(); return post({ cmd: 'cancel', key: rowMeta.key, surah: +t.dataset.cancel }); }
  if (t.dataset.del) {
    e.stopPropagation();
    if (await confirmBox(`حذف سورة ${SURAHS[t.dataset.del - 1][0]} من الجهاز؟`)) post({ cmd: 'delete', key: rowMeta.key, surah: +t.dataset.del });
    return;
  }
  if (t.classList.contains('row')) {
    const i = +t.dataset.i, it = S.rowList[i];
    if (!playable(it.m, it.n)) return toast('السورة دي مش محمّلة، ومفيش إنترنت');
    const list = S.rowList.filter(x => playable(x.m, x.n));
    return startQueue(list, list.indexOf(it));
  }
  switch (t.dataset.act) {
    case 'toReciters': S.detailFrom = 'reciters'; return go('reciters');
    case 'toPlaylists': return go('playlists');
    case 'back': return go(S.detailFrom || 'library');
    case 'retryCatalog': S.catalogErr = null; S.catalogLoading = true; render(); return post({ cmd: 'catalog' });
    case 'refreshCatalog': toast('جاري تحديث القائمة…'); return post({ cmd: 'catalog', refresh: true });
    case 'dlAll': toast('اتضافت السور لقائمة التحميل'); return post({ cmd: 'download', meta, surahs: meta.list });
    case 'cancelKey': return post({ cmd: 'cancel', key: meta.key });
    case 'cancelAll': return post({ cmd: 'cancel' });
    case 'pickFolder': return post({ cmd: 'pickFolder' });
    case 'openFolder': return post({ cmd: 'openFolder' });
    case 'textAll': toast('جاري تحميل نص المصحف…'); return post({ cmd: 'textAll' });
    case 'favReciter': toggleFavReciter(meta); return render();
    case 'resetFolder':
      if (await confirmBox('ترجّع مكان التحميلات للمكان الافتراضي؟ السور المحمّلة هتتنقل معاه.')) post({ cmd: 'resetFolder' });
      return;
    case 'delKey':
      if (await confirmBox(`حذف كل السور المحمّلة لـ ${meta.reciter_ar} (${meta.moshaf_ar})؟`)) post({ cmd: 'delete', key: meta.key });
      return;
    case 'playAll': case 'playFavs': case 'playPl': {
      const list = S.rowList.filter(x => playable(x.m, x.n));
      if (!list.length) return toast('مفيش سور محمّلة تتشغّل من غير إنترنت');
      return startQueue(list, P.shuffle ? Math.floor(Math.random() * list.length) : 0);
    }
    case 'dlPl': {
      const p = S.user.playlists[S.playlist];
      const byKey = {};
      p.items.forEach(x => (byKey[x.m.key] ||= { m: x.m, ns: [] }).ns.push(x.n));
      Object.values(byKey).forEach(g => post({ cmd: 'download', meta: g.m, surahs: g.ns }));
      return toast('سور القائمة اتضافت لقائمة التحميل');
    }
    case 'newPlaylist': {
      const name = await promptBox('اسم القائمة الجديدة', `قائمة ${S.user.playlists.length + 1}`);
      if (name) { S.user.playlists.push({ id: Date.now(), name, items: [] }); saveUser(); render(); }
      return;
    }
    case 'renamePl': {
      const p = S.user.playlists[S.playlist];
      const name = await promptBox('اسم القائمة', p.name);
      if (name) { p.name = name; saveUser(); render(); }
      return;
    }
    case 'deletePl': {
      const p = S.user.playlists[S.playlist];

// ═════════ ambient sounds (generated in code, no sound files) ═════════
const AMB = { rain: 'مطر', sea: 'بحر', wind: 'رياح', fire: 'نار' };
const Amb = {
  ctx: null, nodes: {}, master: null, levels: store.get('amb', { rain: 0, sea: 0, wind: 0, fire: 0 }),
  noise(kind, secs = 4) {

    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c); let b0 = 0, b1 = 0, b2 = 0, last = 0;

        const w = Math.random() * 2 - 1;

        else if (kind === 'crackle') d[i] = Math.random() < 0.0009 ? (Math.random() * 2 - 1) * 0.9 : 0;
      }
    }

// ═════════ memorization (hifz): repeat each verse, leave time to recite it back ═════════
const H = { active: false, finished: false, inGap: false, pendingSeek: false, gapTimer: 0 };

const H_SPEED = [[0.75, '٠٫٧٥×'], [1, '١×'], [1.25, '١٫٢٥×']];
function hCfg() {

}
function setCfg(patch) { store.set('hifzCfg', Object.assign(hCfg(), patch)); }

}
function hStart(o) {

  if (!playable(m, o.n)) return toast('السورة دي مش محمّلة، ومفيش إنترنت');

  if (!S.text[o.n] || S.text[o.n].error) { S.text[o.n] = null; post({ cmd: 'text', surah: o.n }); }

  load(0, false, 0);

    if (!H.active) return;
    if (!ok) { hStop(true); render(); return toast('مش قادر أجيب توقيت الآيات للقارئ ده دلوقتي'); }

// Precise verse-end check while memorizing or playing a portion (timeupdate is only ~4×/s).

    const row = ayahRow(it.m, it.n, it.a1); if (!row) return;

  } else clearInterval(hTick);
}
audio.addEventListener('play', () => {
  if (H.active && H.pendingSeek) { clearTimeout(H.gapTimer); H.inGap = false; H.pendingSeek = false; H.selfSeek = true; seekAyahStart(H.m, H.n, H.cur); hRender(); }
  const it = cur(); if ((H.active && it && it.hifz) || (it && it.seg)) tickStart();
});
audio.addEventListener('seeked', () => {
  if (!H.active) return;
  if (H.selfSeek) { H.selfSeek = false; return; }
  const a = currentAyah();
  if (a >= H.a0 && a <= H.a1 && a !== H.cur) { H.cur = a; H.count = 0; hRender(); }
});

function hLiveHtml() {
  if (!H.active && !H.finished) return '';
  const text = S.text[H.n], ay = text && !text.error ? text[H.cur - 1] : null;
  const cnt = H.a1 - H.a0 + 1;
  if (H.finished) {
    return `<div class="hlive"><div class="sub">${esc(sName(H.n))}، ${AR(H.a0)}–${AR(H.a1)}</div><div class="hdone">${H.review ? 'خلصت المراجعة' : 'خلصت المقطع'}</div>
      <div class="actions" style="justify-content:center">${H.review ? '' : `<button class="btn primary" data-h="markMem">حفظته ✓</button>`}
      <button class="btn" data-h="again">كرّره تاني</button>${H.review ? '' : `<button class="btn" data-h="nextPart">المقطع اللي بعده</button>`}<button class="btn" data-h="close">قفل</button></div></div>`;
  }
  return `<div class="hlive">
    <div class="hmeta"><b>${esc(sName(H.n))}، آية ${AR(H.cur)}</b><span class="sub">${AR(H.cur - H.a0 + 1)} من ${AR(cnt)}</span>
      <span class="tag">التكرار ${AR(H.count + 1)} من ${AR(H.rep)}</span>${H.rounds !== 1 ? `<span class="tag dim">الدورة ${AR(H.round + 1)}${H.rounds ? ` من ${AR(H.rounds)}` : ''}</span>` : ''}
      ${H.inGap ? `<span class="tag ok">دورك: ردّد الآية</span>` : ''}</div>
    <div class="har ${H.hide ? 'hid' : ''}" data-h="reveal">${ay ? `${esc(ay[0])} <span class="num">﴿${AR(H.cur)}﴾</span>` : '<span class="sub">جاري تحميل النص…</span>'}</div>
    ${H.hide ? '<div class="sub" style="text-align:center">الآية مستخبية علشان تختبر نفسك. عدّي عليها بالماوس علشان تشوفها.</div>' : ''}
    <div class="ctl hctl">
      <button class="iconbtn" data-h="prev" title="الآية اللي قبلها">${I.next}</button>
      <button class="pp hpp" data-h="toggle">${audio.paused && !H.inGap ? I.bigPlay : I.bigPause}</button>
      <button class="iconbtn" data-h="next" title="الآية اللي بعدها">${I.prev}</button>
    </div>
    <div class="actions" style="justify-content:center;margin-top:6px">
      <label class="toggle"><input type="checkbox" id="hHide2" ${H.hide ? 'checked' : ''}> اخفي الآية</label>
      <button class="btn" data-h="stop">${I.stop} إنهاء</button>
    </div>
    <div class="hlist">${text && !text.error ? text.slice(H.a0 - 1, H.a1).map((x, j) => `<button class="hitem ${H.a0 + j === H.cur ? 'on' : ''}" data-hgo="${H.a0 + j}"><span class="num">${AR(H.a0 + j)}</span> ${H.hide ? '…' : esc(x[0].split(' ').slice(0, 6).join(' ')) + (x[0].split(' ').length > 6 ? '…' : '')}</button>`).join('') : ''}</div>
  </div>`;
}
function hRender() {
  if (S.view !== 'hifz') return;
  const box = $('#hLive');
  if (!box || (!!box.innerHTML) !== (H.active || H.finished)) return render();
  box.innerHTML = hLiveHtml();
  const on = box.querySelector('.hitem.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
audio.addEventListener('play', () => hRender());
audio.addEventListener('pause', () => hRender());

function viewHifz() {
  const c = hCfg(), m = hReciter(c), total = memTotal();
  const n = Math.min(114, Math.max(1, c.n)), max = QM.ay[n - 1];
  let html = `<h1>الحفظ</h1><div class="sub" style="margin:-12px 0 18px">اختار مقطع، والقارئ يكرّر كل آية وأنت تردّد وراه. وبعد ما تحفظه علّمه، علشان يفضل متابع معاك في المراجعة.</div>
    <div class="set-card kcard"><div class="khead"><b>${total ? `حافظ ${AR(total)} آية من ${AR(6236)}` : 'لسه ما علّمتش آيات إنك حفظتها'}</b><span class="sub" style="margin-inline-start:auto">${AR(Math.round(total / 6236 * 1000) / 10)}٪</span></div>
      <div class="bar" style="height:6px"><i style="width:${total / 6236 * 100}%;background:var(--ok)"></i></div></div>
    <div id="hLive">${hLiveHtml()}</div>`;
  if (!H.active && !H.finished) {
    html += `<div class="set-card kcard">
      <div class="hform">
        <label><span class="flabel">السورة</span><select class="sel" id="hSurah">${SURAHS.map((s, i) => `<option value="${i + 1}" ${i + 1 === n ? 'selected' : ''}>${AR(i + 1)}. ${esc(s[0])} (${AR(QM.ay[i])})</option>`).join('')}</select></label>
        <label><span class="flabel">من آية</span><input class="num-in" type="number" id="hA0" min="1" max="${max}" value="${Math.min(c.a0, max)}"></label>
        <label><span class="flabel">لحد آية</span><input class="num-in" type="number" id="hA1" min="1" max="${max}" value="${Math.min(Math.max(c.a1, c.a0), max)}"></label>
      </div>
      <div class="flabel" style="margin-top:16px">القارئ</div>${reciterSelect('hRec', m)}
      <div class="sub" style="margin-top:6px">${m && isMuallim(m) ? 'المصحف المعلّم بيسيب وقت بعد كل آية علشان تردّد.' : 'جرّب "المصحف المعلّم" للحصري أو المنشاوي، مناسب للحفظ.'}</div>
      <div class="hopts">
        <div><div class="flabel">كرّر كل آية</div><div class="pgrid">${pillsHtml('data-hrep', H_REP, c.rep)}</div></div>
        <div><div class="flabel">كرّر المقطع كله</div><div class="pgrid">${pillsHtml('data-hrounds', H_ROUNDS, c.rounds)}</div></div>
        <div><div class="flabel">وقت تردّد فيه بعد كل آية</div><div class="pgrid">${pillsHtml('data-hgap', H_GAP, c.gap)}</div></div>
        <div><div class="flabel">السرعة</div><div class="pgrid">${pillsHtml('data-hspeed', H_SPEED, c.speed)}</div></div>
      </div>
      <div class="actions"><button class="btn primary" data-h="start">${I.play} ابدأ</button>
        <label class="toggle"><input type="checkbox" id="hHide" ${c.hide ? 'checked' : ''}> اخفي الآيات (اختبر نفسك)</label>
        ${m && !has(m.key, n) && S.online ? `<button class="btn" data-h="dl">${I.down} حمّل السورة</button>` : ''}</div>
    </div>`;
  }
  const memList = Object.keys(mem().mem).map(Number).filter(x => memCount(x)).sort((a, b) => a - b);
  if (memList.length) {
    html += `<h2>محفوظاتك</h2><div class="mlist">${memList.map(x => {
      const cnt = memCount(x), last = mem().review[x], ago = last ? daysBetween(last, Date.now()) : 99;
      return `<div class="mitem"><div class="badge"><span class="n">${x}</span></div><div style="flex:1;min-width:0"><b>${esc(sName(x))}</b>
        <div class="sub">${AR(cnt)} من ${AR(QM.ay[x - 1])} آية، ${ago === 0 ? 'راجعتها النهارده' : ago === 1 ? 'راجعتها امبارح' : `آخر مراجعة من ${AR(ago)} يوم`}</div>
        <div class="bar"><i style="width:${cnt / QM.ay[x - 1] * 100}%;background:var(--ok)"></i></div></div>
        ${ago >= 7 ? '<span class="tag warn">محتاجة مراجعة</span>' : ''}
        <button class="btn" data-hrev="${x}">راجع</button><button class="iconbtn" data-hdel="${x}" title="شيلها من المحفوظات">${I.trash}</button></div>`;
    }).join('')}</div>`;
  }
  return html;
}
function hFormStart() {
  const c = hCfg(), m = hReciter(c);
  if (!m) return toast('قائمة القرّاء لسه بتحمّل، جرّب كمان شوية');
  const max = QM.ay[c.n - 1];
  let a0 = Math.max(1, Math.min(max, +$('#hA0').value || 1)), a1 = Math.max(1, Math.min(max, +$('#hA1').value || a0));
  if (a1 < a0) [a0, a1] = [a1, a0];
  setCfg({ a0, a1 });
  hStart({ m, n: c.n, a0, a1, rep: c.rep, rounds: c.rounds, gap: c.gap, speed: c.speed, hide: c.hide });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-k],[data-kdays],[data-kmode],[data-kday],[data-kread],[data-klisten],[data-kdone],[data-kdl],[data-h],[data-hgo],[data-hrep],[data-hrounds],[data-hgap],[data-hspeed],[data-hrev],[data-hdel]');
  if (!b) return;
  const k = K(), ds = b.dataset;
  if (ds.kdays !== undefined) {
    let days = +ds.kdays;
    if (!days) { const v = await promptBox('هتختم في كام يوم؟ (من ٣ لـ ٦٠٤)', '40'); days = Math.round(+String(v || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))); if (!(days >= 3 && days <= 604)) return v && toast('اكتب رقم من ٣ لـ ٦٠٤'); }
    store.set('khatmaCfg', Object.assign(store.get('khatmaCfg', {}), { days })); return render();
  }
  if (ds.kmode) { store.set('khatmaCfg', Object.assign(store.get('khatmaCfg', {}), { mode: ds.kmode })); return render(); }
  if (ds.kday) { S.kSel = +ds.kday; return render(); }
  if (ds.kread !== undefined) { if (k && +ds.kread >= 0 && +ds.kread < k.days) openWird(+ds.kread); return; }
  if (ds.klisten !== undefined) return listenWird(+ds.klisten);
  if (ds.kdone !== undefined) {
    const i = +ds.kdone;
    kMark(i, !k.done[i]);
    if (ds.kclose && k.done[i]) closeReader();
    S.kSel = null;
    if (S.reader.open && S.reader.range) renderReader();
    if (S.view === 'khatma' || S.view === 'library') render();
    return;
  }
  if (ds.kdl !== undefined) {
    const d = kDay(k.days, +ds.kdl), m = k.reciter;
    post({ cmd: 'download', meta: m, surahs: segmentsOf(d.from, d.to).map(s => s.n).filter(n => !has(m.key, n)) });
    return toast('سور الورد اتضافت لقائمة التحميل');
  }
  switch (ds.k) {
    case 'start': {
      const cfg = Object.assign({ days: 30, mode: 'read' }, store.get('khatmaCfg', {}));
      const rec = cfg.mode === 'listen' ? ((cfg.reciter && findTimed(cfg.reciter)) || defaultTimed()) : null;
      kStart(cfg.days, cfg.mode, rec); S.kSel = null; toast('بالتوفيق! ده وردك الأول'); return render();
    }
    case 'again': kStart(k.days, k.mode, k.reciter); S.kSel = null; return render();
    case 'testRem': post({ cmd: 'testReminder' }); return toast('بعتّ إشعار تجربة');
    case 'switchMode': k.mode = k.mode === 'listen' ? 'read' : 'listen'; if (k.mode === 'listen' && !k.reciter) k.reciter = defaultTimed(); saveUser(); return render();
    case 'cancel':
      if (await confirmBox('إلغاء الختمة دي؟ هيتمسح اللي علّمته منها.')) { S.user.khatma = null; saveUser(); render(); }
      return;
  }
  // memorization
  if (ds.hrep) { setCfg({ rep: +ds.hrep }); return render(); }
  if (ds.hrounds) { setCfg({ rounds: +ds.hrounds }); return render(); }
  if (ds.hgap) { setCfg({ gap: ds.hgap === 'ayah' ? 'ayah' : +ds.hgap }); return render(); }
  if (ds.hspeed) { setCfg({ speed: +ds.hspeed }); return render(); }
  if (ds.hgo) return hGo(+ds.hgo);
  if (ds.hrev) {
    const n = +ds.hrev, r = mem().mem[n], c = hCfg(), m = hReciter(c);
    if (!m) return toast('قائمة القرّاء لسه بتحمّل، جرّب كمان شوية');
    return hStart({ m, n, a0: r[0][0], a1: r[r.length - 1][1], rep: 1, rounds: 1, gap: c.gap === 0 ? 0 : 'ayah', speed: 1, hide: true, review: true });
  }
  if (ds.hdel) {
    const n = +ds.hdel;
    if (await confirmBox(`تشيل سورة ${sName(n)} من محفوظاتك؟`)) { delete mem().mem[n]; delete mem().review[n]; saveUser(); render(); }
    return;
  }
  switch (ds.h) {
    case 'start': return hFormStart();
    case 'dl': { const c = hCfg(), m = hReciter(c); post({ cmd: 'download', meta: m, surahs: [c.n] }); return toast('اتضافت لقائمة التحميل'); }
    case 'toggle':
      if (H.inGap || audio.paused) { if (H.inGap) { clearTimeout(H.gapTimer); H.inGap = false; } audio.play().catch(() => {}); }
      else audio.pause();
      return;
    case 'prev': return hGo(H.cur - 1);
    case 'next': return hGo(H.cur + 1);
    case 'stop': hStop(false); return render();
    case 'close': H.finished = false; return render();
    case 'markMem': memAdd(H.n, H.a0, H.a1); H.finished = false; toast('اتعلّم إنه محفوظ'); return render();
    case 'again': return hStart(Object.assign({}, H));
    case 'nextPart': {
      const len = H.a1 - H.a0 + 1, max = QM.ay[H.n - 1];
      let n = H.n, a0 = H.a1 + 1;
      if (a0 > max) { n = H.n === 114 ? 1 : H.n + 1; a0 = 1; }
      const a1 = Math.min(QM.ay[n - 1], a0 + len - 1);
      setCfg({ n, a0, a1 });
      return hStart(Object.assign({}, H, { n, a0, a1, review: false }));
    }
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'kRem') { saveSettings({ khatmaReminder: e.target.checked }); setTimeout(render, 50); }
  if (id === 'kTime' && v) saveSettings({ reminderTime: v });
  if (id === 'kRec') { store.set('khatmaCfg', Object.assign(store.get('khatmaCfg', {}), { reciter: v })); }
  if (id === 'kRec2') { const m = findTimed(v); if (m && K()) { K().reciter = m; saveUser(); render(); } }
  if (id === 'hSurah') { const n = +v; setCfg({ n, a0: 1, a1: Math.min(QM.ay[n - 1], 5) }); render(); }
  if (id === 'hA0' || id === 'hA1') setCfg({ [id === 'hA0' ? 'a0' : 'a1']: +v });
  if (id === 'hRec') { setCfg({ reciter: v }); render(); }
  if (id === 'hHide') setCfg({ hide: e.target.checked });
  if (id === 'hHide2') { H.hide = e.target.checked; setCfg({ hide: H.hide }); hRender(); }
});

// ── hooks into the player ──
function onTimingArrived() { /* whenReady() polls; nothing else needed */ }
function onTextArrived(n) { if (S.view === 'hifz' && (H.active || H.finished) && H.n === n) hRender(); }
function stateTitle(it) {
  if (it.hifz && H.active) return `${sName(it.n)}، آية ${AR(H.cur)}`;
  if (it.seg && (it.a0 > 1 || it.a1 < QM.ay[it.n - 1])) return `${sName(it.n)} (${AR(it.a0)}–${AR(it.a1)})`;
  return sName(it.n);
}
const _load = load;
load = function (i, autoplay, at) {
  const it = P.queue[i];
  if ((H.active || H.finished) && !(it && it.hifz)) { hStop(true); H.finished = false; }
  if (!(it && it.seg)) P.wird = null;
  if (it && it.seg && it.a0 > 1) {
    _load(i, false, 0);
    if (P.i !== i) return;
    whenReady(() => { if (cur() !== it) return; seekAyahStart(it.m, it.n, it.a0); if (autoplay) audio.play().catch(() => {}); });
  } else _load(i, autoplay, at);
  if (P.i === i && it && (it.seg || it.hifz)) $('#pTitle').textContent = it.seg ? `${stateTitle(it)}، الورد ${AR(it.wird + 1)}` : `${sName(it.n)}، حفظ`;
};
const _step2 = step;
step = function (dir, auto) {
  if (H.active && cur() && cur().hifz) { if (auto) hAyahEnd(); else hGo(H.cur + dir); return; }
  const it = cur();
  if (auto && it && it.seg && P.repeat === 'one') { seekAyahStart(it.m, it.n, it.a0) || (audio.currentTime = 0); audio.play().catch(() => {}); return; }
  if (auto && it && it.seg && P.wird != null && P.i === P.queue.length - 1 && P.repeat === 'off') {
    const w = P.wird, k = K();
    audio.pause(); P.wird = null;
    if (k && w < k.days && !k.done[w]) { kMark(w, true); toast('خلص الورد، واتعلّم إنه خلص. تقبّل الله'); if (S.view === 'khatma' || S.view === 'library') render(); }
    return;
  }
  return _step2(dir, auto);
};
const _qctl2 = window.__qctl;
window.__qctl = a => {
  if ((a === 'pause' || a === 'sleepStop') && H.inGap) { clearTimeout(H.gapTimer); H.inGap = false; reportState(true); hRender(); }
  if (a === 'toggle' && H.inGap) { clearTimeout(H.gapTimer); H.inGap = false; audio.play().catch(() => {}); return; }
  _qctl2(a);
};
const _renderReader = renderReader;
renderReader = function () { if (S.reader.range) return renderWird(); return _renderReader(); };
const _openReader = openReader;
openReader = n => { S.reader.range = null; _openReader(n); };
const _viewLibrary2 = viewLibrary;
viewLibrary = () => khatmaBanner() + _viewLibrary2();
const _render2 = render;
render = function () {
  if (S.view === 'khatma' || S.view === 'hifz') {
    S.rowMeta = {}; S.rowList = [];
    $('#view').innerHTML = S.view === 'khatma' ? viewKhatma() : viewHifz();
    markPlaying(); return;
  }
  _render2();
};

// ───────── boot ─────────
$('#openFolder').onclick = () => post({ cmd: 'openFolder' });
$('#goOnline').onclick = $('#bannerGo').onclick = () => { toast('جاري فتح quranify.pro…'); post({ cmd: 'goOnline' }); };
audio.volume = store.get('vol', 1); setRange($('#vol'), Math.round(audio.volume * 100)); setRange($('#seek'), 0);
syncButtons();
setOnline(navigator.onLine);
post({ cmd: 'status' });
post({ cmd: 'library' });
post({ cmd: 'getSettings' });
post({ cmd: 'getUser' });
post({ cmd: 'textStatus' });
post({ cmd: 'catalog' }); S.catalogLoading = true;
S.detailFrom = 'library';
window.__qgo = v => { closeReader(); go(v); };
go(location.hash === '#khatma' ? 'khatma' : 'library');
if (location.hash) history.replaceState(null, '', '/');
reportState(true);
const saved = store.get('player2', null);
if (saved && saved.queue && saved.queue.length) {
  // Wait for the library so we know which surahs are on disk.
  const wait = setInterval(() => {
    if (S.libLoaded && S.userLoaded) {
      clearInterval(wait); P.queue = saved.queue;
      const it = P.queue[saved.i];
      if (it && playable(it.m, it.n)) load(saved.i, false, saved.t);
    }
  }, 300);
  setTimeout(() => clearInterval(wait), 6000);
}
