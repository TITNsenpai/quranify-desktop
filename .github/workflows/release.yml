# Builds the app and installer on GitHub's Windows machines and attaches them to a release.
# Publish a version:  git tag v1.0.0  &&  git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build app and installer
        shell: pwsh
        run: ./build-release.ps1

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Quranify.exe, README.md, LICENSE -DestinationPath dist/Quranify-portable.zip
          Get-FileHash dist/Quranify-Setup.exe, dist/Quranify-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Upload build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quranify-desktop
          path: |
            dist/Quranify-Setup.exe
            dist/Quranify-portable.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Quranify-Setup.exe
            dist/Quranify-portable.zip
            dist/SHA256SUMS.txt
